name: Check mods
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  behavior-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kyle-Hosman/az-mods-sdk
          ref: 62a156abf3a4789e9e3cdd610fe106227a3a8967
          path: .azmod-sdk
      - name: Verify SDK sanitizer controls
        run: CC=clang sh .azmod-sdk/tools/harness/sanitize.sh --controls
      - name: Host components and production UI with plain, ASan plus UBSan and TSan
        working-directory: src/azhub/linkfake
        run: |
          make test TEST_CC=clang AZ_SDK_INCLUDE=../../../.azmod-sdk/include
      - name: Native USB Names host regressions (plain and ASan plus UBSan)
        working-directory: src/native-usb-names
        run: make test SAN="plain asan" TEST_CC=clang TEST_CXX=clang++ AZ_SDK_INCLUDE=../../.azmod-sdk/include
  sdk-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: Kyle-Hosman/az-mods-sdk
          ref: 62a156abf3a4789e9e3cdd610fe106227a3a8967
          path: .azmod-sdk
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - name: Build and validate with pinned SDK
        run: python3 .azmod-sdk/tools/azmod-pack build src/azhub/linkfake
      - name: Compile safe-eject AZ candidate with pinned SDK
        run: python3 .azmod-sdk/tools/azmod-pack build --no-validate src/azhub/linkfake -- az-candidate
      - name: Package and validate (no publication)
        run: |
          python3 .azmod-sdk/tools/azmod-pack package src/azhub/linkfake
          python3 .azmod-sdk/tools/azmod-pack validate src/azhub/linkfake/dist/*.azmod
          python3 .azmod-sdk/tools/azmod-pack repo check azmods-repo.json
      - name: Build Native USB Names with pinned SDK
        run: python3 .azmod-sdk/tools/azmod-pack build src/native-usb-names
      - name: Package and validate Native USB Names (no publication)
        run: |
          python3 .azmod-sdk/tools/azmod-pack package src/native-usb-names
          python3 .azmod-sdk/tools/azmod-pack validate src/native-usb-names/dist/*.azmod
